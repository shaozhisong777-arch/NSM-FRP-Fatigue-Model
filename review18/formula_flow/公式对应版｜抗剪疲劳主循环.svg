<text x="715.0" y="100.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">开始：输入真实试件与峰谷总荷载 Qmax、Qmin</text>
<rect x="430" y="185" width="570" height="120" rx="14" fill="#E7F0FF" stroke="#6A7E90"/>
<text x="715.0" y="217.28" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">准备裂缝与筋的真实交点、两侧锚固长度</text>
<text x="715.0" y="245.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">初始化 N=0、局部龄期 Ni=0、最大滑移和失效记录</text>
<text x="715.0" y="272.72" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">parameters / prepare_parameters / fatigue_calculate</text>
<rect x="430" y="350" width="570" height="120" rx="14" fill="#E5F3E9" stroke="#6A7E90"/>
<text x="715.0" y="382.28" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">依次求初始峰值和谷值抗剪平衡</text>
<text x="715.0" y="410.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">Vc(q)+Vs(q)+Vf(q)=Qmax/2 或 Qmin/2</text>
<text x="715.0" y="437.72" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">state → trial；内部计算见第2页</text>
<polygon points="715.0,510 1000,560.0 715.0,610 430,560.0" fill="#FFE9CD" stroke="#6A7E90"/>
<text x="715.0" y="560.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">初始峰、谷求解成功？</text>
<polygon points="715.0,655 1000,705.0 715.0,755 430,705.0" fill="#FFE9CD" stroke="#6A7E90"/>
<text x="715.0" y="705.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">N &lt; Nmax？</text>
<rect x="430" y="795" width="570" height="120" rx="14" fill="#E7F0FF" stroke="#6A7E90"/>
<text x="715.0" y="827.28" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">根据峰谷滑移判断本步活跃节点</text>
<text x="715.0" y="855.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">(smax&gt;0.75δm 或曾激活)，且峰谷滑移差&gt;容差</text>
<text x="715.0" y="882.72" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">active_nodes｜F：阈值；历史保持与容差为代码规则</text>
<polygon points="715.0,960 1000,1015.0 715.0,1070 430,1015.0" fill="#FFE9CD" stroke="#6A7E90"/>
<text x="715.0" y="1001.14" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">有活跃节点或启用了</text>
<text x="715.0" y="1028.86" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">其他材料 S–N 退化？</text>
<rect x="430" y="1110" width="570" height="120" rx="14" fill="#E7F0FF" stroke="#6A7E90"/>
<text x="715.0" y="1142.28" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">选取循环块 ΔN，不跨越下一快照或 Nmax</text>
<text x="715.0" y="1170.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">从已接受历史提出候选：Ni,new=Ni,old+ΔN</text>
<text x="715.0" y="1197.72" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">仅活跃节点增加龄期；候选尚不提交</text>
<rect x="430" y="1270" width="570" height="120" rx="14" fill="#E5F3E9" stroke="#6A7E90"/>
<text x="715.0" y="1302.28" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">更新节点峰值黏结应力 [F式2]</text>
<text x="715.0" y="1330.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">τm,i=max{0,[1−kf log₁₀max(Ni,1)]τm,0}</text>
<text x="715.0" y="1357.72" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">kf=0.1965（杆）或0.1985（条）｜bond_strength</text>
<rect x="430" y="1430" width="570" height="120" rx="14" fill="#E5F3E9" stroke="#6A7E90"/>
<text x="715.0" y="1462.28" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">将 τm,i 代入黏结本构，重新求峰值平衡</text>
<text x="715.0" y="1490.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">由裂缝位移q → 滑移场 → 筋力 → 抗剪力</text>
<text x="715.0" y="1517.72" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">state → trial → anchorage / bond（见第2页）</text>
<polygon points="715.0,1590 1000,1645.0 715.0,1700 430,1645.0" fill="#FFE9CD" stroke="#6A7E90"/>
<text x="715.0" y="1631.14" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">峰值失败或 q 增长过快，</text>
<text x="715.0" y="1658.86" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">且 ΔN &gt; 1？</text>
<polygon points="715.0,1740 1000,1790.0 715.0,1840 430,1790.0" fill="#FFE9CD" stroke="#6A7E90"/>
<text x="715.0" y="1790.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">候选峰值平衡成功？</text>
<rect x="430" y="1880" width="570" height="120" rx="14" fill="#E5F3E9" stroke="#6A7E90"/>
<text x="715.0" y="1912.28" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">继承峰值最大滑移历史，求谷值平衡</text>
<text x="715.0" y="1940.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">当前FRP黏结应力＝历史割线刚度×当前滑移</text>
<text x="715.0" y="1967.72" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">state → trial；谷值目标剪力 Qmin/2</text>
<polygon points="715.0,2040 1000,2090.0 715.0,2140 430,2090.0" fill="#FFE9CD" stroke="#6A7E90"/>
<text x="715.0" y="2090.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">候选谷值平衡成功？</text>
<rect x="430" y="2180" width="570" height="120" rx="14" fill="#E7F0FF" stroke="#6A7E90"/>
<text x="715.0" y="2212.28" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">接受本循环块：N←N+ΔN，提交候选历史</text>
<text x="715.0" y="2240.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">保存 q、w、v、Vc、Vs、Vf 与局部滑移/应变/失效</text>
<text x="715.0" y="2267.72" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">fatigue_calculate / save_snapshot</text>
<rect x="430" y="2360" width="570" height="110" rx="14" fill="#FFE9CD" stroke="#6A7E90"/>
<text x="715.0" y="2401.14" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">停止并输出最后有效状态</text>
<text x="715.0" y="2428.86" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#243746">export_results；达到Nmax为runout，不等于疲劳寿命</text>
<rect x="1120" y="1255" width="330" height="140" rx="14" fill="#E7F0FF" stroke="#6A7E90"/>
<text x="1285.0" y="1299.92" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#243746">减小循环块</text>
<text x="1285.0" y="1325.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#243746">ΔN←max[1,floor(ΔN/2)]</text>
<text x="1285.0" y="1350.08" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#243746">从同一份已接受历史重算</text>
<rect x="1120" y="2040" width="330" height="160" rx="14" fill="#FFE2DE" stroke="#6A7E90"/>
<text x="1285.0" y="2082.38" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#243746">记录停止原因</text>
<text x="1285.0" y="2107.46" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#243746">局部数值失败 / 用户限制 /</text>
<text x="1285.0" y="2132.54" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#243746">域内指定分支无平衡根</text>
<text x="1285.0" y="2157.62" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#243746">不能统一写成“脱黏破坏”</text>
<rect x="50" y="655" width="300" height="100" rx="14" fill="#FFE9CD" stroke="#6A7E90"/>
<text x="200.0" y="692.46" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#243746">达到循环上限</text>
<text x="200.0" y="717.54" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#243746">记录runout</text>
<rect x="50" y="960" width="300" height="120" rx="14" fill="#FFE9CD" stroke="#6A7E90"/>
<text x="200.0" y="994.92" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#243746">没有可演化退化项</text>
