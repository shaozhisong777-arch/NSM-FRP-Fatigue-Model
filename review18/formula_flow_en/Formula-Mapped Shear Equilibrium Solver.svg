<polygon points="1120,2157.5 1102.0,2164.5 1102.0,2150.5" fill="#1685B6"/>
<text x="1078.0" y="2145.5" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#B8302E">No</text>
<polyline points="1450,2157.5 1510,2157 1510,117 1000,117.5" fill="none" stroke="#1685B6" stroke-width="3" marker-end="url(#a)"/>
<polygon points="1000,117.5 1017.9931286076874,110.48235631374568 1018.0068540912871,124.48234958556905" fill="#1685B6"/>
<text x="1420" y="1000.0" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#B8302E">Yes: adjust q</text>
<polyline points="1285.0,2215 1285.0,2265" fill="none" stroke="#1685B6" stroke-width="3" marker-end="url(#a)"/>
